# Server Configuration
server.port=8081
server.servlet.context-path=/
# Bind to IPv4 only (0.0.0.0 for IPv4, not IPv6)
server.address=0.0.0.0

# Application Configuration
spring.application.name=SmartBin

# Database Configuration (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/smartbins
spring.datasource.username=postgres
spring.datasource.password=hieu2002
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.com.smartbin=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.mail=DEBUG
logging.level.com.sun.mail=DEBUG
logging.level.org.springframework.mail.javamail=TRACE
logging.level.org.eclipse.angus=TRACE

# CORS Configuration (Allow both localhost and IPv4 addresses)
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# JWT Configuration
smartbin.jwt.secret=smartbin-secret-key-for-jwt-token-generation-2024-very-long-secret
smartbin.jwt.expiration=86400000

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
spring.security.user.roles=ADMIN

# Allow circular references (temporary solution)
spring.main.allow-circular-references=true

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=465
spring.mail.username=damhieu.sk@gmail.com
spring.mail.password=yhyhzaxqwsofkpxb
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.socketFactory.port=465
spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtp.socketFactory.fallback=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.from=${spring.mail.username}
spring.mail.properties.mail.smtp.from=${spring.mail.username}
